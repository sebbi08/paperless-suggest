# Runs typecheck, unit tests and build on pull requests and on pushes to master
# and to renovate/** (Renovate only opens a PR once its branch has checks, see
# prCreation: not-pending).
# The Playwright e2e tests (npm run test:e2e) are not part of this workflow.
name: ci

on:
  pull_request:
  push:
    branches: [master, "renovate/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same major as the Dockerfile base image (node:22-slim)
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
